; ── PlatformIO Project Configuration ─────────────────────────────────────────
; Target: ESP-01 (ESP8266, 1 MB flash)
; Framework: Arduino
; Upload: USB-TTL adapter (GPIO 0 must be held LOW during power-on to flash)

[env:esp01_1m]
platform  = espressif8266
board     = esp01_1m
framework = arduino

; LittleFS filesystem (512 KB code / 512 KB FS split recommended for ESP-01 1M)
board_build.filesystem = littlefs

; Upload speed (lower if you get errors with your USB-TTL adapter)
upload_speed = 115200

; Serial monitor
monitor_speed = 115200

; Dependencies — PlatformIO will fetch these automatically
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5

; Build flags
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS

; Source filter — keep all sources in src/
src_filter = +<*>
